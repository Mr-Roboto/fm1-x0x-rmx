<title id="title">X0X-HARDER - custom FM-1 firmware</title>
<desc id="desc">909 and 808 drums, dual 303 acid engines and a six-voice Juno. A rising pitch line crosses a sixteen-step sequencer with tied notes and octave shifts.</desc>
